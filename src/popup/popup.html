<!DOCTYPE html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <title>Cookie Shield</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <span class="shield" aria-hidden="true">🛡️</span>
      <h1>Cookie Shield</h1>
      <label class="switch">
        <input type="checkbox" id="enabled" />
        <span id="enabledLabel">Açık</span>
      </label>
    </header>

    <section>
      <h2>Bu site</h2>
      <div class="host" id="host">—</div>
      <div class="status" id="status">—</div>
      <button id="activate" class="primary">Bu sitede korumayı aç</button>
      <div class="note" id="scope"></div>
      <div class="row"><span>Bu sayfada engellenen pop-up</span><span id="tabActions">0</span></div>
      <div class="row"><span>Sitede duran çerez</span><span id="cookieCount">—</span></div>
    </section>

    <section>
      <h2>Kapsam</h2>
      <div class="modes" id="scopes">
        <label class="mode">
          <input type="radio" name="scope" value="sites" />
          <span><b>Sadece açtığım siteler</b><small>Varsayılan: eklenti hiçbir yerde çalışmaz, tek tek sen açarsın.</small></span>
        </label>
        <label class="mode">
          <input type="radio" name="scope" value="all" />
          <span><b>Tüm siteler</b><small>Her sitede çalışır; istisnalar izin listesinden yönetilir.</small></span>
        </label>
      </div>
    </section>

    <section>
      <h2>Çerez modu <span class="hint-inline">(açık sitelerde geçerli)</span></h2>
      <div class="modes" id="modes">
        <label class="mode">
          <input type="radio" name="mode" value="blockAll" />
          <span><b>Tümünü engelle</b><small>Çerez yazımı/gönderimi engellenir (en katı).</small></span>
        </label>
        <label class="mode">
          <input type="radio" name="mode" value="sessionOnly" />
          <span><b>Oturum boyu</b><small>Çerezler çalışır ama sekme kapanınca silinir. Girişler bozulmaz.</small></span>
        </label>
        <label class="mode">
          <input type="radio" name="mode" value="thirdParty" />
          <span><b>Sadece 3. taraf</b><small>Takipçi çerezleri gider, sitenin kendi çerezleri kalır.</small></span>
        </label>
        <label class="mode">
          <input type="radio" name="mode" value="off" />
          <span><b>Kapalı</b><small>Çerezlere dokunulmaz, sadece onay pop-up'ları reddedilir.</small></span>
        </label>
      </div>
    </section>

    <section>
      <h2>Eylemler</h2>
      <div class="actions">
        <button id="scan">Bu sayfayı şimdi tara ve reddet</button>
        <button id="clear" class="warn">Bu sitenin çerezlerini sil</button>
        <button id="allow" hidden>Bu sitede çerezlere izin ver</button>
        <button id="disable" hidden>Bu sitede eklentiyi kapat</button>
      </div>
      <div class="note" id="note"></div>
    </section>

    <div class="toast" id="toast"></div>

    <footer>
      <span id="stats">—</span>
      <a href="#" id="openOptions">Ayarlar</a>
    </footer>

    <script src="popup.js"></script>
  </body>
</html>
